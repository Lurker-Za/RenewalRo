  - Id: 23207
    AegisName: Premium_Box
    Name: 프리미엄 정액 서비스 상자
    Type: Usable
    Delay:
      CheckStatus: true
      Status: Premium_Storageboost
    Weight: 10
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoCart: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    Script: |
      .@now = gettimetick(2);
      #pre_start = .@now;
      #pre_duration = 2592000000;
      sc_start4 SC_PREMIUM_ITEMBOOST,#pre_duration,20,0,0,.@now;
      sc_start4 SC_PREMIUM_EXPBOOST,#pre_duration,20,0,0,.@now;
      sc_start4 SC_PREMIUM_STORAGEBOOST,#pre_duration,0,0,0,.@now;
      getitem 23165,1;
